name: Backport merged pull request

# Reusable backport workflow shared by the MoveIt Pro repositories. The caller
# owns the triggers, which must be exactly:
#
#   on:
#     pull_request_target:
#       types: [closed]
#     issue_comment:
#       types: [created]
#
# The `github` context in a called workflow is the caller's, so the job-level
# `if:` below reads the caller's event and every git operation targets the
# caller's repository.
on:
  workflow_call:
    inputs:
      description_preamble:
        description: >
          Markdown inserted into the generated PR body after the
          "Backport of #N" line and before the copied Release notes section.
          Use it for anything the caller's PR-description check requires. The
          action's `${pull_number}` and `${target_branch}` placeholders are
          substituted here too.
        type: string
        default: ""
    secrets:
      backport_app_client_id:
        description: Client ID of the GitHub App that opens the backport PRs.
        required: true
      backport_app_private_key:
        description: Private key of the GitHub App that opens the backport PRs.
        required: true

# All operations in this workflow — including `actions/checkout` — flow
# through a GitHub App installation token (see the `app-token` step), so
# the default `GITHUB_TOKEN` only needs the minimum scope to satisfy the
# Actions runner.
permissions:
  contents: read

jobs:
  backport:
    name: Backport pull request
    runs-on: ubuntu-latest

    # Job-level rather than workflow-level so that the many `issue_comment`
    # runs this job skips never take a slot in the group.
    concurrency:
      group: backport-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false

    # Run on merged PRs that carry a backport label (default `label_pattern` is `^backport ([^ ]+)$`),
    # or on `/backport <branch>` comments posted on a merged pull request.
    # The trailing space in `/backport ` avoids matching `/backporting`, `/backport-status`, etc.
    if: >
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.merged &&
        contains(toJSON(github.event.pull_request.labels.*.name), '"backport ')
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.issue.pull_request.merged_at != null &&
        startsWith(github.event.comment.body, '/backport ')
      )

    steps:
      # The default `GITHUB_TOKEN` cannot push to `.github/workflows/` — the
      # Actions App has no `workflows` write capability and the `permissions:`
      # schema has no key to grant it. A GitHub App installation token does
      # carry that capability, scoped to the App's installation and short-lived
      # (~1 hour), so it replaces the previously-used PAT (`PRO_ACTION_USER`).
      #
      # Mint the App token before `actions/checkout` and pass it as the
      # checkout token. Otherwise `actions/checkout` persists the workflow's
      # read-only `GITHUB_TOKEN` in `http.<url>.extraheader` (in a temp config
      # included at local scope). That header — which git sends on every
      # subsequent push — overrides the App-token credentials that
      # `korthout/backport-action` injects into its push URL, and GitHub
      # honors the read-only extraheader and returns 403
      # ("Write access to repository not granted").
      #
      # The App token is also what makes the generated PR's required checks run
      # at all: a PR opened with `GITHUB_TOKEN` triggers no further workflows,
      # so a required PR-description check would never report and — with
      # `auto_merge_enabled` below — the backport would sit pending forever.
      - name: Generate Token for backport
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.backport_app_client_id }}
          private-key: ${{ secrets.backport_app_private_key }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      # On the `/backport <branch>` comment path the action has no label to read,
      # so parse the target branch out of the first line of the comment and feed
      # it to the action via `target_branches`. Skipped for the label-triggered
      # `pull_request_target` path, where the action's default `label_pattern`
      # extracts the branch from the `backport <branch>` label name.
      #
      # Anyone who can comment on the PR can post `/backport`, which on a public
      # caller is any GitHub account. The label path needs triage access, so
      # require write access here before the App token pushes a branch. The
      # legacy `permission` field folds `maintain` into `write`; it is listed
      # anyway in case GitHub reports it directly. A commenter with no
      # relationship to the repository may get a 404, which also rejects.
      - name: Parse target branch from /backport comment
        id: parse-comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const commenter = context.payload.comment.user.login;
            let permission = 'none';
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: commenter,
              });
              permission = data.permission;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!['admin', 'maintain', 'write'].includes(permission)) {
              core.setFailed(`@${commenter} has '${permission}' access; /backport requires write access.`);
              return;
            }

            // Take only the first token after `/backport ` so trailing text in the
            // same comment (e.g. an explanation) doesn't get fed in as part of the
            // branch name.
            const match = context.payload.comment.body.match(/^\/backport\s+(\S+)/);
            if (!match) {
              core.setFailed('Expected `/backport <branch>` but found no target branch in the comment.');
              return;
            }
            const branch = match[1];
            core.info(`Parsed target branch from comment: ${branch}`);
            core.setOutput('branch', branch);

      # The backport action only exposes the source PR's FULL body via its
      # `${pull_description}` placeholder — there's no built-in way to copy just
      # one section. Extract the `Release notes` section here so the action can
      # append it to the generated backport PR description below (see the
      # `pull_description` input). The section is everything from its header up
      # to (but not including) the next same-or-higher markdown header or the
      # next thematic break (`---`) — exactly where the PR template ends it,
      # with the `---` separator before `## Claude agent checks`. The parser is
      # fenced-code-block aware (a `## ...` or `---` inside a ``` fence is not a
      # real header/break), strips the template's HTML-comment placeholder so an
      # unfilled section yields nothing, and emits an empty string when the
      # source PR has no Release notes content.
      #
      # The source PR body is attacker-controllable, so it is read as DATA via
      # the `context.payload` object — never interpolated into this script with
      # `${{ }}` — which is the documented-safe pattern for `pull_request_target`.
      - name: Extract Release notes section from source PR
        id: release-notes
        if: github.event_name == 'pull_request_target' || github.event_name == 'issue_comment'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // On the comment path the PR body lives on `issue.body` (a PR is an
            // issue); on the merge path it's on `pull_request.body`. The
            // job-level `if:` guarantees one of these two events.
            const body = (context.eventName === 'issue_comment'
              ? context.payload.issue?.body
              : context.payload.pull_request?.body) || '';

            const headerRe = /^ {0,3}(#{1,6})\s+(.*?)\s*$/; // up to 3 leading spaces (CommonMark)
            const breakRe = /^ {0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/;
            const fenceRe = /^ {0,3}(`{3,}|~{3,})(.*)$/;

            // Mask HTML comments outside fenced code while preserving line
            // boundaries. A literal `<!--` inside a fenced example is code,
            // while a commented heading is not a rendered section.
            let inComment = false;
            let commentScanFence = null;
            let inlineCodeTicks = null;
            let maskInlineCode = false;
            const sourceLines = body.split(/\r?\n/);
            // An ATX heading, list item, blockquote, fence, thematic break, or
            // setext underline interrupts a paragraph in CommonMark, so inline
            // parsing never reaches past one. A code span therefore cannot
            // extend across a block start, and the scan below must stop there
            // as well as at a blank line. Only `1.` and `1)` may interrupt, so
            // other ordinals are excluded.
            //
            // The pattern is deliberately not exact: it also stops on empty
            // markers (`*`, `1.` alone) and mixed runs (`-=-=`), and misses a
            // spaced break (`_ _ _`). Masking is opt-in — a span opens only
            // when a closing run is found — so stopping early means no span
            // opens and text stays visible; the extra stops under-mask, and the
            // missed one over-masks. Neither can change a verdict, because
            // every landmark this gate reads (ATX headings, thematic breaks,
            // `- [x]` checkboxes) is itself a paragraph interrupter and so can
            // never sit inside an inline code span.
            // moveit_pro's `test_block_start_regex_pins_actual_matches` records
            // the full set against the copy in its `pr-description.yaml`.
            const blockStartRe = /^ {0,3}(?:#{1,6}(?:[ \t]|$)|>|(?:[-+*]|1[.)])(?:[ \t]|$)|`{3,}|~{3,}|(?:\*{3,}|_{3,})[ \t]*$|[-=]+[ \t]*$)/;
            const hasClosingBacktickRun = (lineIndex, offset, ticks) => {
              for (let i = lineIndex; i < sourceLines.length; i++) {
                const candidate = sourceLines[i];
                if (
                  i > lineIndex
                  && (candidate.trim() === '' || blockStartRe.test(candidate))
                ) return false;
                let j = i === lineIndex ? offset : 0;
                while (j < candidate.length) {
                  if (candidate[j] !== '`') { j++; continue; }
                  let end = j + 1;
                  while (candidate[end] === '`') end++;
                  if (end - j === ticks) return true;
                  j = end;
                }
              }
              return false;
            };
            const lines = sourceLines.map((line, lineIndex) => {
              if (!inComment && commentScanFence === null && line.trim() === '') {
                inlineCodeTicks = null;
                maskInlineCode = false;
                return line;
              }
              const fenceMatch = line.match(fenceRe);
              if (commentScanFence !== null) {
                if (
                  fenceMatch
                  && fenceMatch[1][0] === commentScanFence.marker
                  && fenceMatch[1].length >= commentScanFence.length
                  && /^[ \t]*$/.test(fenceMatch[2])
                ) {
                  commentScanFence = null;
                }
                return line;
              }
              if (
                !inComment
                && fenceMatch
                && !(fenceMatch[1][0] === '`' && fenceMatch[2].includes('`'))
              ) {
                commentScanFence = {
                  marker: fenceMatch[1][0],
                  length: fenceMatch[1].length,
                };
                return line;
              }
              if (!inComment && inlineCodeTicks === null && /^(?: {4}|\t)/.test(line)) {
                return line;
              }

              let visible = '';
              let offset = 0;
              while (offset < line.length) {
                if (inComment) {
                  const end = line.indexOf('-->', offset);
                  if (end === -1) return visible + ' '.repeat(line.length - offset);
                  visible += ' '.repeat(end + 3 - offset);
                  offset = end + 3;
                  inComment = false;
                } else {
                  if (
                    inlineCodeTicks !== null
                    && line[offset] === '`'
                  ) {
                    let end = offset + 1;
                    while (line[end] === '`') end++;
                    const ticks = end - offset;
                    const wasMasked = maskInlineCode;
                    if (ticks === inlineCodeTicks) {
                      inlineCodeTicks = null;
                      maskInlineCode = false;
                    }
                    visible += wasMasked
                      ? ' '.repeat(ticks)
                      : line.slice(offset, end);
                    offset = end;
                  } else if (inlineCodeTicks !== null) {
                    visible += maskInlineCode ? ' ' : line[offset];
                    offset++;
                  } else if (
                    line[offset] === '\\'
                    && offset + 1 < line.length
                  ) {
                    visible += line.slice(offset, offset + 2);
                    offset += 2;
                  } else if (line[offset] === '`') {
                    let end = offset + 1;
                    while (line[end] === '`') end++;
                    const ticks = end - offset;
                    if (
                      hasClosingBacktickRun(lineIndex, end, ticks)
                    ) {
                      inlineCodeTicks = ticks;
                      maskInlineCode = !line.slice(end).includes('`'.repeat(ticks));
                    }
                    visible += maskInlineCode
                      ? ' '.repeat(ticks)
                      : line.slice(offset, end);
                    offset = end;
                  } else if (
                    inlineCodeTicks === null
                    && line.startsWith('<!--', offset)
                  ) {
                    visible += ' '.repeat(4);
                    offset += 4;
                    inComment = true;
                  } else {
                    visible += line[offset];
                    offset++;
                  }
                }
              }
              return visible;
            });

            // Return true for every fence-marker line. An opening fence records
            // its marker and length; only a matching run at least that long,
            // followed by whitespace only, can close it (CommonMark semantics).
            let fence = null;
            const updateFence = (line) => {
              const match = line.match(fenceRe);
              if (!match) return false;
              const marker = match[1][0];
              const length = match[1].length;
              if (fence === null) {
                if (marker === '`' && match[2].includes('`')) return false;
                fence = { marker, length };
              } else if (
                marker === fence.marker
                && length >= fence.length
                && /^[ \t]*$/.test(match[2])
              ) {
                fence = null;
              }
              return true;
            };

            // 1. Locate the "Release notes" header, skipping fenced code blocks
            //    (a `## Release notes` quoted inside a ``` fence is not real).
            //    `.replace(/\s+#+\s*$/, '')` strips ATX closing hashes so
            //    `## Release notes ##` still matches.
            let start = -1;
            let level = 0;
            for (let i = 0; i < lines.length; i++) {
              if (updateFence(lines[i])) continue;
              if (fence !== null) continue;
              const m = lines[i].match(headerRe);
              if (m && m[2].replace(/\s+#+\s*$/, '').trim().toLowerCase() === 'release notes') {
                start = i;
                level = m[1].length;
                break;
              }
            }

            if (start === -1) {
              core.info('No "Release notes" section found in the source PR description.');
              core.setOutput('section', '');
              return;
            }

            // 2. Collect the section body — fence-aware so a `---` or header
            //    inside a code block doesn't terminate it early.
            const collected = [];
            fence = null;
            for (let i = start + 1; i < lines.length; i++) {
              if (updateFence(lines[i])) { collected.push(lines[i]); continue; }
              if (fence === null) {
                const m = lines[i].match(headerRe);
                if (m && m[1].length <= level) break; // next same/higher-level header
                if (breakRe.test(lines[i])) break;    // thematic break (template separator)
              }
              collected.push(lines[i]);
            }

            // 3. HTML comments were removed before parsing, so an unfilled
            //    template placeholder yields an empty section.
            const cleaned = collected.join('\n');
            if (cleaned.trim() === '') {
              core.info('Release notes section is empty (unfilled template). Emitting nothing.');
              core.setOutput('section', '');
              return;
            }

            // 4. Rebuild: header + tidied body (drop leading/trailing blank
            //    runs, collapse 3+ newlines to a single blank line).
            let section = lines[start] + '\n\n'
              + cleaned.replace(/^\n+/, '').replace(/\s+$/, '').replace(/\n{3,}/g, '\n\n');

            // 5. Neutralize GitHub issue-closure keywords (close/fix/resolve +
            //    #N | GH-N | owner/repo#N) by backtick-quoting the keyword, so
            //    merging the backport doesn't replay a `Closes #N` smuggled in
            //    from the source PR's notes and close an unrelated issue.
            section = section.replace(
              /\b(close[sd]?|fix(?:e[sd])?|resolve[sd]?)(\s*:?\s+)((?:[\w.-]+\/[\w.-]+)?#\d+|GH-\d+)/gi,
              (m, kw, sep, ref) => '`' + kw + '`' + sep + ref);

            core.setOutput('section', section);

      # Join the action's default body, the caller's preamble, and the copied
      # Release notes section with blank lines, dropping whichever parts are
      # empty. Both values arrive through `env` rather than `${{ }}` in the
      # script: the section comes from the attacker-controllable source PR
      # body. The single-quoted `${pull_number}` / `${target_branch}` are the
      # action's own placeholders, left literal for it to substitute.
      #
      # The preamble precedes the copied section deliberately. The collector
      # above runs to end-of-body while a fence is open, so a source PR whose
      # Release notes section contains an unclosed fence yields a section that
      # would swallow anything appended after it — stranding a backport that
      # has `auto_merge_enabled` and no watcher. Leading also means a
      # first-heading-wins check finds the preamble's sections rather than
      # ones copied in from the source body.
      - name: Compose backport PR description
        id: description
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREAMBLE: ${{ inputs.description_preamble }}
          SECTION: ${{ steps.release-notes.outputs.section }}
        with:
          script: |
            const parts = [
              '# Description\nBackport of #${pull_number} to `${target_branch}`.',
              (process.env.PREAMBLE || '').trim(),
              process.env.SECTION || '',
            ];
            core.setOutput('body', parts.filter((part) => part.trim() !== '').join('\n\n'));

      - name: Create backport pull requests
        uses: korthout/backport-action@2e830a1d0b8269505846ddd407a70876913ad1f8 # v4.6.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          target_branches: ${{ steps.parse-comment.outputs.branch }}
          # The action backports to the union of label matches and
          # `target_branches`. On the comment path only the commented branch
          # should run, not every `backport <branch>` label already on the PR,
          # so an empty pattern turns label matching off there. The condition
          # is written this way round because an empty string is falsy: in
          # `cond && '' || pattern` the pattern would always win.
          label_pattern: ${{ github.event_name != 'issue_comment' && '^backport ([^ ]+)$' || '' }}
          add_author_as_assignee: true
          add_labels: backport
          # Pinned off rather than left to the action's default: a release
          # milestone such as `10.1.1` belongs to its own series, and a
          # milestone check on the target branch can reject it. Backports
          # therefore arrive unmilestoned; set the target series' milestone by
          # hand when one matters.
          copy_milestone: false
          auto_merge_enabled: true
          copy_all_reviewers: true
          experimental: '{"conflict_resolution": "draft_commit_conflicts"}'
          pull_description: ${{ steps.description.outputs.body }}
