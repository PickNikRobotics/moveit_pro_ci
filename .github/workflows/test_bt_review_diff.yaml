name: Test bt_review_diff

on:
  pull_request:
    paths:
      - '.github/actions/bt_review_diff/**'
      - '.github/workflows/test_bt_review_diff.yaml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        working-directory: .github/actions/bt_review_diff
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt pytest==9.1.1
          .venv/bin/python -m pytest -q test_bt_review_diff.py
