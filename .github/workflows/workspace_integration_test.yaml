name: Workspace Integration Test

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        default: main
      config_package:
        type: string
        default: ""
      colcon_build_args:
        type: string
        default: ""
      colcon_test_args:
        type: string
        default: ""
      runner:
        type: string
        default: "studio_16_core_runner"
      mujoco_ci_timestep:
        description: >
          If non-empty, set MuJoCo `<option timestep>` to this value (seconds) on every
          top-level `<mujoco>` scene file under `src/` before build. Used to keep the
          simulator at-or-under realtime on slower CI runners; leave empty for normal
          runs. Suggested: "0.004" (250 Hz).
        type: string
        default: ""
      use_ccache:
        description: >
          If true, use ccache to speed up the colcon build. The ccache directory is
          restored from and saved to the GitHub Actions cache, and
          `CMAKE_{C,CXX}_COMPILER_LAUNCHER` is set to `ccache` for the build step.
        type: boolean
        default: false
      enable_gpu:
        description: >
          If true, pass `--gpus all` to the studio container so workloads inside
          it can access NVIDIA hardware. The caller is responsible for routing
          the job to a GPU-equipped runner; this flag alone will fail on runners
          that have no GPU exposed.
        type: boolean
        default: false
      git_ref:
        description: >
          Git ref (branch, tag, or SHA) for the caller's repository to check
          out. Defaults to empty, which lets `actions/checkout` use the
          triggering ref (correct for `pull_request` and `push`). Set this
          when the workflow is triggered by `repository_dispatch` and the
          caller needs to run against a specific paired branch carried in
          the dispatch payload (for example, `v9.3`).
        type: string
        default: ""
      image_ref:
        description: >
          Full container image reference template that overrides the default
          `picknikciuser/moveit-studio:<image_tag>-<ros_distro>` from Docker
          Hub. Useful when a caller (typically a `repository_dispatch` from a
          sister repo) needs the integration run to pull a private GHCR image
          built for a specific PR.

          Uses `format()` semantics: `{0}` is substituted with the matrix ROS
          distro at job start, so one input covers every distro the matrix
          expands over. Example:
          `ghcr.io/picknikrobotics/moveit-studio:my-branch-{0}-amd64`.

          When set, `enable_gpu`'s CUDA suffix is NOT auto-appended — bake the
          full ref (including any suffix) into the template if you need a GPU
          image.
        type: string
        default: ""

      fetch_lfs:
        description: >
          Whether to fetch Git LFS objects during checkout. Set false to skip
          LFS entirely for workspaces that do not use it. Ignored when
          lfs_cache_s3_bucket is set (the cache path always fetches LFS).
        type: boolean
        default: true
      lfs_cache_s3_bucket:
        description: >
          If set, fetch Git LFS objects through an S3-backed cache instead of a
          direct pull: objects are restored from this bucket, any still-missing
          ones are pulled from the Git remote, then the set is saved back. Leave
          empty (default) for a normal direct LFS pull. Requires
          lfs_cache_role_arn, and the calling job must grant `id-token: write`.
        type: string
        default: ""
      lfs_cache_aws_region:
        description: AWS region of lfs_cache_s3_bucket.
        type: string
        default: "us-east-1"

    secrets:
      moveit_license_key:
        required: true
      lfs_cache_role_arn:
        description: >
          AWS IAM role ARN to assume via GitHub OIDC for read/write access to
          lfs_cache_s3_bucket. Required when lfs_cache_s3_bucket is set. A secret
          (not an input) so the ARN is not shown in run logs.
        required: false

jobs:
  integration-test-in-studio-container:
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        ros_distro:
          - humble
          - jazzy
    env:
      MOVEIT_LICENSE_KEY: ${{ secrets.moveit_license_key }}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: /tmp/cyclonedds.xml
      MOVEIT_DOCKER_TAG: ${{ inputs.image_tag }}-${{ matrix.ros_distro }}
      # We always need to test in mocked hardware
      MOVEIT_CONFIG_PACKAGE: ${{ inputs.config_package }}
    container:
      # When `image_ref` is set, format it with the matrix ROS distro and use
      # it verbatim — this is the dispatched-from-sister-repo path that needs
      # a private GHCR image. Otherwise fall back to the Docker Hub default
      # used by every existing caller, appending the CUDA suffix when
      # `enable_gpu` is set.
      image: ${{ inputs.image_ref != '' && format(inputs.image_ref, matrix.ros_distro) || format('picknikciuser/moveit-studio:{0}-{1}{2}', inputs.image_tag, matrix.ros_distro, inputs.enable_gpu && '-cuda12.6-cudnn9' || '') }}
      # GHA expressions support short-circuit: `cond && 'a' || 'b'`. Empty string
      # when GPU is disabled is fine — GHA omits empty `options` from the
      # `docker create` invocation.
      options: ${{ inputs.enable_gpu && '--gpus all' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check if config package specified
        id: check_config_package
        run: |
          if [ -z "${{ inputs.config_package }}" ]; then
            echo "No config package specified, building all packages"
            echo "config_package_test_arg=" >> $GITHUB_OUTPUT
            echo "config_package_build_arg=" >> $GITHUB_OUTPUT
          else
            echo "Using specified config package: ${{ inputs.config_package }}"
            echo "config_package_test_arg=--packages-select ${{ inputs.config_package }}" >> $GITHUB_OUTPUT
            echo "config_package_build_arg=--packages-up-to ${{ inputs.config_package }}" >> $GITHUB_OUTPUT
          fi

      - name: Set USER_WS environment variable
        id: set_user_ws
        run: echo "USER_WS=/__w/$(basename ${{ github.repository }})/$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Empty ``ref`` falls back to the default (triggering ref).
          ref: ${{ inputs.git_ref }}
          submodules: recursive
          # Direct LFS pull only when fetching LFS and not using the S3 cache.
          lfs: ${{ inputs.fetch_lfs && inputs.lfs_cache_s3_bucket == '' }}

      # Optional S3-backed Git LFS cache. Inert unless lfs_cache_s3_bucket is
      # set, so the default path is an unchanged direct checkout. The calling
      # job must grant `id-token: write` to use this.
      - name: Validate LFS cache configuration
        if: ${{ inputs.lfs_cache_s3_bucket != '' }}
        env:
          ROLE_ARN: ${{ secrets.lfs_cache_role_arn }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::lfs_cache_s3_bucket is set but the lfs_cache_role_arn secret is empty."
            exit 1
          fi
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::lfs_cache_s3_bucket is set but the calling job did not grant 'id-token: write'."
            exit 1
          fi
      - name: Configure AWS credentials for LFS cache
        if: ${{ inputs.lfs_cache_s3_bucket != '' }}
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ secrets.lfs_cache_role_arn }}
          aws-region: ${{ inputs.lfs_cache_aws_region }}
      - name: Mark all directories as safe for git
        if: ${{ inputs.lfs_cache_s3_bucket != '' }}
        run: |
          # The cache steps below run raw git in the container (key hashing, the
          # cache action, git lfs pull across submodules), which trips
          # "detected dubious ownership" when the checkout is owned by a
          # different uid than the container user. '*' covers the workspace and
          # every submodule git dir; safe in an ephemeral single-tenant CI runner.
          git config --global --add safe.directory '*'
      - name: Compute LFS cache key
        if: ${{ inputs.lfs_cache_s3_bucket != '' }}
        id: lfs_cache_key
        run: |
          set -o pipefail
          # Include submodule LFS pointers so the key reflects every LFS object the
          # recursive checkout needs. Submodule listing is best-effort: a flaky list
          # only causes a cache miss, never wrong content.
          top=$(git lfs ls-files -l)
          sub=$(git submodule foreach --recursive --quiet 'git lfs ls-files -l' 2>/dev/null || true)
          echo "key=lfs-${{ github.repository_id }}-$(printf '%s\n%s' "$top" "$sub" | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - name: Restore Git LFS objects from S3 cache
        id: lfs_restore
        if: ${{ inputs.lfs_cache_s3_bucket != '' }}
        continue-on-error: true
        uses: runs-on/cache/restore@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env:
          RUNS_ON_S3_BUCKET_CACHE: ${{ inputs.lfs_cache_s3_bucket }}
          AWS_REGION: ${{ inputs.lfs_cache_aws_region }}
        with:
          path: |
            .git/lfs
            .git/modules/**/lfs
          key: ${{ steps.lfs_cache_key.outputs.key }}
          restore-keys: lfs-${{ github.repository_id }}-
      - name: Fetch Git LFS objects (repo + submodules)
        if: ${{ inputs.lfs_cache_s3_bucket != '' }}
        run: |
          git lfs pull
          # actions/checkout's `lfs: true` does not recurse LFS into submodules, so a
          # recursive checkout leaves submodule LFS as pointers. Pull them too so the
          # cached content matches a full recursive LFS checkout.
          git submodule foreach --recursive 'git lfs pull'
      - name: Save Git LFS objects to S3 cache
        if: ${{ inputs.lfs_cache_s3_bucket != '' && steps.lfs_restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: runs-on/cache/save@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        env:
          RUNS_ON_S3_BUCKET_CACHE: ${{ inputs.lfs_cache_s3_bucket }}
          AWS_REGION: ${{ inputs.lfs_cache_aws_region }}
        with:
          path: |
            .git/lfs
            .git/modules/**/lfs
          key: ${{ steps.lfs_cache_key.outputs.key }}

      # MuJoCo 3.6.0's heavier constraint solver makes some scenes run slower than
      # realtime on CI runners, which surfaces as flaky gripper/camera timeouts.
      # When `mujoco_ci_timestep` is set, inject an `<option timestep="..." />` into
      # every top-level MuJoCo scene under `src/` so the sim stays at-or-under realtime.
      # MuJoCo merges multiple <option> elements, so this just adds (or overrides) the
      # timestep attribute without disturbing other settings (integrator, impratio, ...).
      #
      # Inject ONLY into top-level scene files -- never into a file that is pulled in
      # via <include>. An included file's children are spliced into its parent at the
      # <include> site, which may be inside a <body>/<worldbody>, where a global
      # <option> is invalid and makes MuJoCo abort the whole model load with
      # "Schema violation: unrecognized element 'option'". Skipping include targets
      # keeps the inject on the one place a global <option> is always legal: the
      # top-level scene root. (<mujocoinclude>-rooted fragments are skipped too, both
      # because they're include targets and because the root regex excludes them.)
      - name: Override MuJoCo timestep for CI
        if: inputs.mujoco_ci_timestep != ''
        env:
          MUJOCO_CI_TIMESTEP: ${{ inputs.mujoco_ci_timestep }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          ts = os.environ['MUJOCO_CI_TIMESTEP']
          # Reject anything that isn't a positive float to keep the sed-like inject safe.
          if not re.fullmatch(r'\d+(\.\d+)?(e-?\d+)?', ts) or float(ts) <= 0:
              raise SystemExit(f"mujoco_ci_timestep must be a positive number, got {ts!r}")
          src = pathlib.Path('src')
          xml_files = list(src.rglob('*.xml'))

          def read(path):
              try:
                  return path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  return None

          # Collect every file pulled in via <include file="...">, resolved relative to
          # the including file's directory. These are model fragments spliced into a
          # parent (sometimes inside a <body>) where a global <option> is illegal --
          # never inject into them. An <include> path is relative to the file that
          # declares it (MuJoCo's meshdir/assetdir do not affect <include>).
          include_re = re.compile(
              r'''<include\b[^>]*\bfile\s*=\s*(?:"([^"]*)"|'([^']*)')'''
          )
          included = set()
          for path in xml_files:
              text = read(path)
              if text is None:
                  continue
              for m in include_re.finditer(text):
                  rel = m.group(1) or m.group(2)
                  included.add((path.parent / rel).resolve())

          # Match `<mujoco>` or `<mujoco ...>` but not `<mujocoinclude>` (mujoco followed
          # by space, '>', or '/').
          mujoco_root = re.compile(r'(<mujoco[\s>/])')
          opening = re.compile(r'(<mujoco\b[^>]*>)')
          patched = []
          skipped_includes = []
          for path in xml_files:
              if path.resolve() in included:
                  skipped_includes.append(str(path))
                  continue
              text = read(path)
              if text is None or not mujoco_root.search(text):
                  continue
              # Strip any existing `timestep="..."` attribute on <option> elements first
              # allowing XML-valid whitespace around `=` and either quote style,
              # so a later <option timestep="..."> cannot override the injected CI
              # timestep when MuJoCo merges <option> attributes across elements (last wins).
              stripped = re.sub(
                  r"""(<option\b[^>]*?)\s+timestep\s*=\s*(?:"[^"]*"|'[^']*')""",
                  r'\1',
                  text,
              )
              # Inject a new <option timestep="..."/> right after the opening <mujoco ...>
              # tag. MuJoCo merges <option> attributes across elements (last wins).
              new_text, n = opening.subn(
                  r'\1\n  <option timestep="' + ts + '" />  <!-- CI override (moveit_pro_ci) -->',
                  stripped,
                  count=1,
              )
              if n:
                  path.write_text(new_text, encoding='utf-8')
                  patched.append(str(path))
          if not patched:
              raise SystemExit(
                  f"mujoco_ci_timestep={ts} was set but no top-level <mujoco> scene "
                  "files were found under src/. Refusing to proceed silently."
              )
          print(f"Patched {len(patched)} top-level MuJoCo scene file(s) with timestep={ts}:")
          for p in patched:
              print(f"  {p}")
          if skipped_includes:
              print(f"Left {len(skipped_includes)} <include>d fragment(s) unpatched:")
              for p in sorted(skipped_includes):
                  print(f"  {p}")
          PY

      # The 'lo' interfaces will not have multicast, and will fail trying to claim a participant index
      # with the default cyclone dds config. We set one for the unit tests to be able to execute.
      - name: Configure DDS
        run: |
          cat <<EOF > /tmp/cyclonedds.xml
          <?xml version="1.0" ?>
          <CycloneDDS xmlns="https://cdds.io/config" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="https://cdds.io/config https://raw.githubusercontent.com/eclipse-cyclonedds/cyclonedds/master/etc/cyclonedds.xsd">
           <Domain id="any">
               <General>
                   <Interfaces>
                       <NetworkInterface autodetermine="true"/>
                   </Interfaces>
                   <AllowMulticast>false</AllowMulticast>
               </General>
               <Discovery>
                   <ParticipantIndex>auto</ParticipantIndex>
                   <Peers>
                       <Peer Address="127.0.0.1" />
                   </Peers>
                   <MaxAutoParticipantIndex>50</MaxAutoParticipantIndex>
               </Discovery>
           </Domain>
          </CycloneDDS>
          EOF

      - name: Install colcon mixins
        run: |
          colcon mixin add default https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
          colcon mixin update
          colcon metadata add default https://raw.githubusercontent.com/colcon/colcon-metadata-repository/master/index.yaml
          colcon metadata update
          cp $USER_WS/colcon-defaults.yaml ~/.colcon/defaults.yaml
          echo "Using ~/.colcon/defaults.yaml:"
          cat ~/.colcon/defaults.yaml

      - name: Install rosdeps
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          . /opt/overlay_ws/install/setup.sh
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Restore ccache
        if: inputs.use_ccache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ inputs.image_tag }}-${{ matrix.ros_distro }}-${{ inputs.config_package }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.image_tag }}-${{ matrix.ros_distro }}-${{ inputs.config_package }}-
            ccache-${{ inputs.image_tag }}-${{ matrix.ros_distro }}-

      - name: Configure ccache
        if: inputs.use_ccache
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends ccache
          fi
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          ccache --zero-stats
          ccache --show-config

      - name: Run colcon build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          . /opt/overlay_ws/install/setup.sh
          # When ccache is enabled, pass the compiler-launcher defines via
          # `colcon build --cmake-args` rather than via env vars: it is explicit,
          # works regardless of build-tree state, and avoids setting empty
          # `CMAKE_{C,CXX}_COMPILER_LAUNCHER` env values that could override a
          # caller-provided launcher when `use_ccache` is false.
          ccache_cmake_args=""
          if [ "${{ inputs.use_ccache }}" = "true" ]; then
            ccache_cmake_args="--cmake-args -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          colcon build ${{ inputs.colcon_build_args }} ${{ steps.check_config_package.outputs.config_package_build_arg }} $ccache_cmake_args

      - name: Show ccache stats
        if: inputs.use_ccache && always()
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: ccache --show-stats --verbose

      - name: Save ccache
        if: inputs.use_ccache && always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ inputs.image_tag }}-${{ matrix.ros_distro }}-${{ inputs.config_package }}-${{ github.sha }}

      - name: Run colcon test
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          . /opt/overlay_ws/install/setup.sh
          . ./install/setup.sh
          env
          echo "Running colcon test"
          external_packages="$(colcon list --base-paths src/external_dependencies --names-only || true)"
          if [ -n "$external_packages" ]; then
              colcon test --packages-skip $external_packages --retest-until-pass 1 ${{ inputs.colcon_test_args }} ${{ steps.check_config_package.outputs.config_package_test_arg }}
          else
              colcon test --retest-until-pass 1 ${{ inputs.colcon_test_args }} ${{ steps.check_config_package.outputs.config_package_test_arg }}
          fi

      - if: always()
        run: |
          colcon test-result --verbose

      # Upload test results as artifacts to be able to see them in the github actions UI.
      # Suffix with `matrix.ros_distro` so the humble and jazzy jobs don't both upload
      # to the same artifact name -- which races on the GitHub Actions side and makes
      # the per-distro results indistinguishable to downstream consumers
      # (e.g. a consumer-side `actions/download-artifact` step rendering a report).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ inputs.config_package }}-${{ matrix.ros_distro }}
          path: |
            build/*/test_results/
            build/*/Testing/
          retention-days: 15
