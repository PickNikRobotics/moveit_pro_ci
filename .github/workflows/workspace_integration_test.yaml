name: Workspace Integration Test

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        default: main
      config_package:
        type: string
        default: ""
      colcon_build_args:
        type: string
        default: ""
      colcon_test_args:
        type: string
        default: ""
      runner:
        type: string
        default: "studio_16_core_runner"
      mujoco_ci_timestep:
        description: >
          If non-empty, set MuJoCo `<option timestep>` to this value (seconds) on every
          top-level `<mujoco>` scene file under `src/` before build. Used to keep the
          simulator at-or-under realtime on slower CI runners; leave empty for normal
          runs. Suggested: "0.004" (250 Hz).
        type: string
        default: ""

    secrets:
      moveit_license_key:
        required: true

jobs:
  integration-test-in-studio-container:
    runs-on: ${{ inputs.runner }}
    strategy:
      matrix:
        ros_distro:
          - humble
    env:
      MOVEIT_LICENSE_KEY: ${{ secrets.moveit_license_key }}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: /tmp/cyclonedds.xml
      MOVEIT_DOCKER_TAG: ${{ inputs.image_tag }}-${{ matrix.ros_distro }}
      # We always need to test in mocked hardware
      MOVEIT_CONFIG_PACKAGE: ${{ inputs.config_package }}
    container: picknikciuser/moveit-studio:${{ inputs.image_tag }}-${{ matrix.ros_distro }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check if config package specified
        id: check_config_package
        run: |
          if [ -z "${{ inputs.config_package }}" ]; then
            echo "No config package specified, building all packages"
            echo "config_package_test_arg=" >> $GITHUB_OUTPUT
            echo "config_package_build_arg=" >> $GITHUB_OUTPUT
          else
            echo "Using specified config package: ${{ inputs.config_package }}"
            echo "config_package_test_arg=--packages-select ${{ inputs.config_package }}" >> $GITHUB_OUTPUT
            echo "config_package_build_arg=--packages-up-to ${{ inputs.config_package }}" >> $GITHUB_OUTPUT
          fi

      - name: Set USER_WS environment variable
        id: set_user_ws
        run: echo "USER_WS=/__w/$(basename ${{ github.repository }})/$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          lfs: true

      # MuJoCo 3.6.0's heavier constraint solver makes some scenes run slower than
      # realtime on CI runners, which surfaces as flaky gripper/camera timeouts.
      # When `mujoco_ci_timestep` is set, inject an `<option timestep="..." />` into
      # every top-level MuJoCo scene under `src/` so the sim stays at-or-under realtime.
      # MuJoCo merges multiple <option> elements, so this just adds (or overrides) the
      # timestep attribute without disturbing other settings (integrator, impratio, ...).
      - name: Override MuJoCo timestep for CI
        if: inputs.mujoco_ci_timestep != ''
        env:
          MUJOCO_CI_TIMESTEP: ${{ inputs.mujoco_ci_timestep }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          ts = os.environ['MUJOCO_CI_TIMESTEP']
          # Reject anything that isn't a positive float to keep the sed-like inject safe.
          if not re.fullmatch(r'\d+(\.\d+)?(e-?\d+)?', ts) or float(ts) <= 0:
              raise SystemExit(f"mujoco_ci_timestep must be a positive number, got {ts!r}")
          # Match `<mujoco>` or `<mujoco ...>` but not `<mujocoinclude>` (mujoco followed
          # by space, '>', or '/').
          mujoco_root = re.compile(r'(<mujoco[\s>/])')
          patched = []
          for path in pathlib.Path('src').rglob('*.xml'):
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if not mujoco_root.search(text):
                  continue
              # Strip any existing `timestep="..."` attribute on <option> elements first
              # allowing XML-valid whitespace around `=` and either quote style,
              # so a later <option timestep="..."> cannot override the injected CI
              # timestep when MuJoCo merges <option> attributes across elements (last wins).
              stripped = re.sub(
                  r"""(<option\b[^>]*?)\s+timestep\s*=\s*(?:"[^"]*"|'[^']*')""",
                  r'\1',
                  text,
              )
              # Inject a new <option timestep="..."/> right after the opening <mujoco ...>
              # tag. MuJoCo merges <option> attributes across elements (last wins).
              opening = re.compile(r'(<mujoco\b[^>]*>)')
              new_text, n = opening.subn(
                  r'\1\n  <option timestep="' + ts + '" />  <!-- CI override (moveit_pro_ci) -->',
                  stripped,
                  count=1,
              )
              if n:
                  path.write_text(new_text, encoding='utf-8')
                  patched.append(str(path))
          if not patched:
              raise SystemExit(
                  f"mujoco_ci_timestep={ts} was set but no <mujoco> scene files were "
                  "found under src/. Refusing to proceed silently."
              )
          print(f"Patched {len(patched)} MuJoCo scene file(s) with timestep={ts}:")
          for p in patched:
              print(f"  {p}")
          PY

      # The 'lo' interfaces will not have multicast, and will fail trying to claim a participant index
      # with the default cyclone dds config. We set one for the unit tests to be able to execute.
      - name: Configure DDS
        run: |
          cat <<EOF > /tmp/cyclonedds.xml
          <?xml version="1.0" ?>
          <CycloneDDS xmlns="https://cdds.io/config" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="https://cdds.io/config https://raw.githubusercontent.com/eclipse-cyclonedds/cyclonedds/master/etc/cyclonedds.xsd">
           <Domain id="any">
               <General>
                   <Interfaces>
                       <NetworkInterface autodetermine="true"/>
                   </Interfaces>
                   <AllowMulticast>false</AllowMulticast>
               </General>
               <Discovery>
                   <ParticipantIndex>auto</ParticipantIndex>
                   <Peers>
                       <Peer Address="127.0.0.1" />
                   </Peers>
                   <MaxAutoParticipantIndex>50</MaxAutoParticipantIndex>
               </Discovery>
           </Domain>
          </CycloneDDS>
          EOF

      - name: Install colcon mixins
        run: |
          colcon mixin add default https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
          colcon mixin update
          colcon metadata add default https://raw.githubusercontent.com/colcon/colcon-metadata-repository/master/index.yaml
          colcon metadata update
          cp $USER_WS/colcon-defaults.yaml ~/.colcon/defaults.yaml
          echo "Using ~/.colcon/defaults.yaml:"
          cat ~/.colcon/defaults.yaml

      - name: Install rosdeps
        run: |
          . /opt/ros/humble/setup.sh
          . /opt/overlay_ws/install/setup.sh
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Run colcon build
        run: |
          . /opt/ros/humble/setup.sh
          . /opt/overlay_ws/install/setup.sh
          colcon build ${{ inputs.colcon_build_args }} ${{ steps.check_config_package.outputs.config_package_build_arg }}

      - name: Run colcon test
        run: |
          . /opt/ros/humble/setup.sh
          . /opt/overlay_ws/install/setup.sh
          . ./install/setup.sh
          env
          echo "Running colcon test"
          external_packages="$(colcon list --base-paths src/external_dependencies --names-only || true)"
          if [ -n "$external_packages" ]; then
              colcon test --packages-skip $external_packages --retest-until-pass 1 ${{ inputs.colcon_test_args }} ${{ steps.check_config_package.outputs.config_package_test_arg }}
          else
              colcon test --retest-until-pass 1 ${{ inputs.colcon_test_args }} ${{ steps.check_config_package.outputs.config_package_test_arg }}
          fi

      - if: always()
        run: |
          colcon test-result --verbose

      # Upload test results as artifacts to be able to see them in the github actions UI
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ inputs.config_package }}
          path: |
            build/*/test_results/
            build/*/Testing/
          retention-days: 15
